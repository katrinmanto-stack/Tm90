name: Unzip
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          for z in *.zip; do
            [ -e "$z" ] || exit 0
            mkdir /tmp/x
            unzip -q "$z" -d /tmp/x
            d=/tmp/x
            n=$(ls -A /tmp/x | wc -l)
            if [ "$n" -eq 1 ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
              d="/tmp/x/$(ls -A /tmp/x)"
            fi
            cp -a "$d"/. .
            git rm -q "$z"
            rm -rf /tmp/x
          done
          rm -rf __MACOSX
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || exit 0
          git push
