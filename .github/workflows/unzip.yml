name: Extract Sungold Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p /tmp/sungold
          unzip -q sungold-store-v4.zip -d /tmp/sungold
          cp -a /tmp/sungold/. .
          rm sungold-store-v4.zip

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract Sungold Store v4" || echo "No changes"
          git push
