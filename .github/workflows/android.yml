name: android

# ساخت فایل نصبی اندروید (APK). دستی: Actions → android → Run workflow
# یا با ساختن تگ مثل v1.0.0 (APK به بخش Releases هم اضافه می‌شود).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # فقط برای ساختن Release روی تگ

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project from ./app
        run: npx cap add android

      - name: Generate icons and splash from ./assets
        run: npx capacitor-assets generate --android

      - name: Copy web files into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sungold-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sungold-admin-apk
          path: sungold-admin.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sungold-admin.apk
