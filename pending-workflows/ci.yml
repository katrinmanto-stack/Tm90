name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: PHP syntax (php -l) — حیاتی؛ قبل از نصب روی سایت واقعی
        run: |
          sudo apt-get update -y && sudo apt-get install -y php-cli
          find theme -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Schema is valid JSON with unique keys
        run: python3 -c "import json;j=json.load(open('theme/bazar/inc/schema.json'));k=[f['key'] for f in j['fields']];assert len(k)==len(set(k));print(len(k),'fields OK')"
      - name: App JavaScript syntax
        run: for f in app/js/*.js app/sw.js tools/*.mjs; do node --check "$f"; done
      - name: Palette contrast guarantees
        run: node tools/test-palette.mjs
      - name: Product SEO analyzer
        run: node tools/test-seo.mjs
      - name: Photo background removal
        run: node tools/test-matting.mjs
      - name: Min-cut correctness
        run: node tools/test-maxflow.mjs
      - name: GrabCut
        run: node tools/test-grabcut.mjs
      - name: Build theme zip
        run: cd theme && zip -r ../bazar-theme.zip bazar -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with: { name: bazar-theme, path: bazar-theme.zip }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow && playwright install --with-deps chromium
      - run: python3 tools/make-fixtures.py
      - name: End-to-end — settings, preview, upload
        run: |
          node tools/mock-server.mjs & sleep 2
          python3 tools/e2e.py
          kill %1
      - name: End-to-end — banners, products, SEO
        run: |
          sleep 1
          MOCK_PER_PAGE=4 node tools/mock-server.mjs & sleep 2
          python3 tools/e2e-products.py
          kill %1
      - name: End-to-end — orders
        run: |
          sleep 1
          MOCK_PER_PAGE=4 node tools/mock-server.mjs & sleep 2
          python3 tools/e2e-orders.py
          kill %1
      - name: End-to-end — purchase requests (approve before pay)
        run: |
          sleep 1
          MOCK_PER_PAGE=4 node tools/mock-server.mjs & sleep 2
          python3 tools/e2e-requests.py
          kill %1
      - name: End-to-end — photo studio
        run: |
          sleep 1
          node tools/mock-server.mjs & sleep 2
          python3 tools/e2e-photo.py
          kill %1

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deployment
        uses: actions/deploy-pages@v4
