name: Move Sungold Files to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Files
        run: |
          set -e

          if [ ! -d "sungold-store" ]; then
            echo "Source folder not found!"
            exit 1
          fi

          cp -a sungold-store/. .
          rm -rf sungold-store

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Move Sungold files to repository root"
          git push
